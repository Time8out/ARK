<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ARK</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a deep link or refresh on a
      // client-side route (e.g. /ARK/dashboard) 404s. This encodes the intended
      // path into a query string and redirects to index.html, which decodes it
      // back (see the script in index.html) before React Router takes over.
      var segmentCount = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
